[project]
name = "garmin-archive"
version = "0.1.0"
description = "Local-first archive of Garmin Connect activities via the Personal API, with a read-only SQL interface."
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "typer",
    "garmin-fit-sdk",
    "platformdirs",
]

[project.scripts]
garmin-archive = "garmin_archive.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_archive"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".agents", ".claude", ".takt", "templates", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.11"
include = ["src", "tests"]
exclude = ["**/.venv", "**/__pycache__"]
strict = ["src/garmin_archive"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: opt-in tests against the real Garmin API (requires GARMIN_LIVE_TESTS=1)",
]
